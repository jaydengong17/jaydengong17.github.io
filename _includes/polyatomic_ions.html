Which list to test on?
<select id="which_list">
  <option value="og">OG list</option>
  <option value="short" selected>Short list</option>
</select>
<button id="load_button" onclick="loadTest()">load</button>

<button id="start_button" onclick="startTest()" disabled="true">press load button</button>
<span id="grade">Your grade: &#45;&#45;/&#45;&#45;</span>
<span id="time">Time: &#45;&#45;:&#45;&#45;.&#45;&#45;&#45; (best &#45;&#45;:&#45;&#45;.&#45;&#45;&#45;)</span>

<table id="that_table">
    <thead>
        <td>Name</td>
        <td>Formula</td>
        <td>Charge</td>
    </thead>
    <tbody>
        <tr>
            <!-- when is css dropping? -->
            <td><input type="text" id="name" style="border: none; width: 100%; height:100%; background-color: #fdfdfd; font-size: 12pt;"></td>
            <td><input type="text" id="formula" style="border: none; width: 100%; height:100%; background-color: #fdfdfd; font-size: 12pt;"></td>
            <td><input type="text" id="charge" style="border: none; width: 100%; height:100%; background-color: #fdfdfd; font-size: 12pt;"></td>
        </tr>
    </tbody>
</table>
<p id="correct_box" style="background-color: #057005; color: #fdfdfd; padding:2px; text-align: center;" hidden="true">Correct!</p>
<p id="incorrect_box" style="background-color: #8c170c; color:#fdfdfd; padding:2px; text-align: center;" hidden="true">Incorrect!<br>abcd</p>

<table id="guess_summary" hidden="true">
    <thead>
        <td style="width:6%"></td>
        <td style="width:50%">Your guess</td>
        <td style="width:44%">Answer</td>
    </thead>
    <tbody>
    </tbody>
</table>

<script>
    // not using a separate js file because this should be small-ish
    const nameInput = document.getElementById("name");
    const formulaInput = document.getElementById("formula");
    const chargeInput = document.getElementById("charge");
    const startButton = document.getElementById("start_button");
    const gradeText = document.getElementById("grade");
    const timeText = document.getElementById("time");
    const correctBox = document.getElementById("correct_box");
    const incorrectBox = document.getElementById("incorrect_box");
    const guessTable = document.getElementById("guess_summary");
    const guessBody = guessTable.children[1];
    const listSelect = document.getElementById("which_list");
    const loadButton = document.getElementById("start_button");
    

    let loaded = false;
    let testStarted = false;
    let enterHasBeenPressed = false;
    
    const example_paths = ["/assets/polyatomic_ions.txt", "/assets/polyatomic_ions_small.txt"];
    const example_names = ["og", "short"];
    const example_times = ["best-time", "best-time-short"];

    // these will hold the examples for the current loaded thing
    let examples = [];
    let examples_len = 0;
    let example_time = "best-time";

    let guessHistory = [];

    let startTime = 0;
    // store best time in localStorage
    if (localStorage.getItem("best-time") === null){
        localStorage.setItem("best-time", null);
    }
    // do this again for short.
    if (localStorage.getItem("best-time-short") === null){
        localStorage.setItem("best-time-short", null);
    }

    let correct = 0;

    function loadTest() {
        // get selected one
        load(example_names.indexOf(listSelect.value));
    }

    // i is the ith path of the example_paths list
    function load(example_i) {
        loaded = false;
        startButton.disabled = true;
        startButton.textContent = "press load button";

        examples = [];
        // now populate the list, which comes from a text file
        fetch(example_paths[example_i]).then((response)=>{
            return response.text();
        }).then((text) => {
            const polyatomic_ions = text.split("\n");
            // construct list.
            for (let ion_i = 0; ion_i < polyatomic_ions.length; ion_i++) {
                // each row of the txt contains name,formula,charge
                // split by commas into length 3 list.
                let ion_example = polyatomic_ions[ion_i].split(",");
                ion_example[2] = parseInt(ion_example[2], 10);
                examples.push(ion_example);
            }

            examples_len = examples.length;
            example_time = example_times[example_i];
            // update total questions in grade
            gradeText.textContent = "Your grade: -/" + examples_len.toString();
            // show time. Large line of code.
            timeText.textContent = "Time: --:--.--- (best " + formatTime(parseFloat(localStorage.getItem(example_times[example_i]))) + ")";
        });

        // wait until list exists.
        let waitInterval = setInterval(() => {
            if (examples_len != 0) {
                clearInterval(waitInterval);
                loaded = true;
                startButton.disabled = false;
                startButton.textContent = "start";
            }
        }, 10);
    }

    function shuffled(l) {
        let outList = [...examples]; // make copy
        // regular fisher yates shuffle
        for (let i = l.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            // swap
            [outList[i], outList[j]] = [outList[j], outList[i]];
        }
        return outList;
    }

    async function getUserSubmissionForExample(input1, input2) {
        // keep doing this until user decides to submit
        while (true) {
            // wait for enter, to switch focus
            await new Promise((resolve) => {
                function waitForEnter(keyevent) {
                    if (keyevent.key == "Enter") {
                        document.removeEventListener("keydown", waitForEnter);
                        resolve(keyevent);
                    }
                }
                document.addEventListener("keydown", waitForEnter);
            })

            // switch focus to charge or grade, depending on currently focused element
            let focusedElement = document.activeElement;
            if (focusedElement === input1) {
                input2.focus();
            } else {
                break;
            }
        }
    }

    function checkCorrect(guess, answer) {
        return guess[0].trim().toLowerCase() === answer[0] && guess[1].trim().toLowerCase() === answer[1] && parseInt(guess[2], 10) === answer[2];
    }

    function formatTime(t) {
        if (isNaN(t)) {
            return "--:--.---";
        }
        if (t >= 60000) { // more than a minute
            return Math.floor(t / 60000).toString() + ":" + ((t - 60000 * Math.floor(t / 60000))/1000).toFixed(3).padStart(6, "0");
        } else {
            return (t / 1000).toString() + " seconds";
        }
    }

    function showGuessHistory(guess, answer) {
        for (let i = 0; i < examples_len; i++) {
            newRow = guessBody.insertRow(-1);
            newRow.insertCell(-1);
            newRow.insertCell(-1);
            newRow.insertCell(-1);

            if (checkCorrect(guess[i], answer[i])){
                newRow.cells[0].style.backgroundColor = "#057005";
            } else {
                newRow.cells[0].style.backgroundColor = "#8c170c";
            }
            newRow.cells[1].textContent = guess[i].join(" ");
            newRow.cells[2].textContent = answer[i].join(" ");
        }

        guessTable.hidden=false;
    }

    // why does it suddenly start being async? idk
    async function startTest() { // loooong function
        // skip if examples aren't loaded
        if (!loaded) {
            return;
        }
        if (testStarted) {
            return;
        }
        testStarted = true;
        correct = 0;

        // reset guess history
        guessBody.innerHTML = "";

        // reset grade
        gradeText.textContent = "Your grade: -/" + examples_len.toString();
        guessHistory = [];

        startButton.textContent = "finish first (or reload)";
        startButton.disabled=true;

        // hide things
        guessTable.hidden=true;
        correctBox.hidden=true;
        incorrectBox.hidden=true;

        startTime = Date.now();

        // shuffle
        let shuffled_examples = shuffled(examples);

        for (const example of shuffled_examples) {
            // clear for next round
            nameInput.value = "";
            formulaInput.value = "";
            chargeInput.value = "";

            // write the same code twice based on which one to hide, mostly
            if (Math.random() < 0.5) {
                // hide name/show formula
                formulaInput.value = example[1];
                formulaInput.disabled=true;
                // focus on name
                nameInput.focus();

                await getUserSubmissionForExample(nameInput, chargeInput);

                formulaInput.disabled=false;
            } else {
                // hide formula/show name
                nameInput.value = example[0];
                nameInput.disabled=true;
                // focus on formula
                formulaInput.focus();

                await getUserSubmissionForExample(formulaInput, chargeInput);
                nameInput.disabled=false;
            }

            // check correctness
            if (checkCorrect([nameInput.value, formulaInput.value, chargeInput.value], example)) {
                correct++;

                correctBox.hidden=false;
                incorrectBox.hidden=true;
            } else {
                correctBox.hidden=true;
                incorrectBox.hidden=false;
                incorrectBox.innerHTML = "Incorrect! correct answer is: " + example[0] + " " + example[1] + " " + example[2].toString() +
                    "<br>(you wrote " + nameInput.value + " " + formulaInput.value + " " + chargeInput.value + ")";
            }

            // add to the running guess history
            guessHistory.push([nameInput.value, formulaInput.value, chargeInput.value]);
        }

        // timing
        elapsed = Date.now() - startTime + 5000 * (examples_len - correct)
        if (localStorage.getItem(example_time) === "null") {
            localStorage.setItem(example_time, elapsed);
        } else {
            if (parseFloat(localStorage.getItem(example_time)) > elapsed) {
                localStorage.setItem(example_time, elapsed);
            }
        }

        timeText.textContent = "Time: " + formatTime(elapsed) + " (best " + formatTime(parseFloat(localStorage.getItem(example_time))) + ")";

        // after everything, clear
        nameInput.value = "";
        formulaInput.value = "";
        chargeInput.value = "";
        
        // update guess history
        showGuessHistory(guessHistory, shuffled_examples);

        // update grade
        gradeText.textContent = "Your grade: " + correct.toString() + "/" + examples_len.toString();

        startButton.textContent="start";
        startButton.disabled=false;

        // can start new test
        testStarted=false;
    }
</script>
